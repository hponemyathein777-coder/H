<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Khan Stainless Steel Enterprise</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .calculator-card {
            width: 100%;
            max-width: 440px;
            background: #4a4a4d;
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.2), 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }

        .logo-box {
            width: 50px;
            height: 50px;
            background: #a33b45;
            margin: 0 auto 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.3);
        }

        .logo-box div {
            width: 24px;
            height: 24px;
            border: 3px solid #fff;
            border-radius: 2px;
        }

        .title {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .input-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .label {
            width: 100px;
            font-size: 14px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 1px 1px rgba(0,0,0,0.5);
        }

        .colon {
            width: 20px;
            font-size: 14px;
            color: #ffffff;
            font-weight: bold;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="number"] {
            width: 100%;
            background: linear-gradient(180deg, #7a7a7e 0%, #a0a0a4 100%);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px 10px;
            color: #111;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }

        input[type="number"]::placeholder {
            color: #555;
            font-weight: normal;
            font-size: 13px;
        }
