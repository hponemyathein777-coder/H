<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr Khan Stainless Steel Enterprise</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: #333;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .calculator-card {
      width: 100%;
      max-width: 420px;
      background: #4a4a4d;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #555;
    }

    .logo-box {
      width: 44px;
      height: 44px;
      background: #a33b45;
      margin: 0 auto 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 6px;
    }

    .logo-box div {
      width: 20px;
      height: 20px;
      border: 3px solid #fff;
      border-radius: 2px;
    }

    .title {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }

    .label {
      width: 110px;
      font-size: 15px;
      color: #ffffff;
      font-weight: bold;
    }

    .colon {
      width: 20px;
      font-size: 15px;
      color: #ffffff;
      font-weight: bold;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="number"] {
      width: 100%;
      background: #2d2d30;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      outline: none;
    }

    .btn-counter {
      width: 36px;
      height: 36px;
      background: #3a3a3d;
      border: 1px solid #222;
      border-radius: 18px;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .btn-counter:active {
      background: #222;
    }

    .result-box {
      width: 100%;
      background: #2d2d30;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 18px;
      font-weight: bold;
      color: #61f7d5;
      min-height: 42px;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <div class="logo-box">
      <div></div>
    </div>
    <div class="title">Mr Khan Stainless Steel Enterprise</div>

    <div class="input-row">
      <div class="label">Height</div>
      <div class="colon">:</div>
      <div class="input-wrapper">
        <input type="number" id="height" oninput="autoCalculateStrips()">
      </div>
    </div>

    <div class="input-row">
      <div class="label">Hollow</div>
      <div class="colon">:</div>
      <div class="input-wrapper">
        <input type="number" id="hollow" oninput="autoCalculateStrips()">
      </div>
    </div>

    <div class="input-row">
      <div class="label">Long Gap</div>
      <div class="colon">:</div>
      <div class="input-wrapper">
        <input type="number" id="longGap" oninput="autoCalculateStrips()">
      </div>
    </div>

    <div class="input-row">
      <div class="label">Short Gap</div>
      <div class="colon">:</div>
      <div class="input-wrapper">
        <input type="number" id="shortGap" oninput="autoCalculateStrips()">
      </div>
    </div>

    <div class="input-row" style="margin-top: 24px;">
      <div class="label">Strips</div>
      <div class="colon">:</div>
      <div class="input-wrapper">
        <input type="number" id="strips" oninput="calculateGapOnly()">
        <div class="btn-counter" onclick="adjustStrips(1)">+</div>
        <div class="btn-counter" onclick="adjustStrips(-1)">-</div>
      </div>
    </div>

    <div class="input-row">
      <div class="label">Gap</div>
      <div class="colon">:</div>
      <div class="input-wrapper">
        <div class="result-box" id="gapResult"></div>
      </div>
    </div>
  </div>

  <script>
    function autoCalculateStrips() {
      const height = parseFloat(document.getElementById('height').value);
      const hollow = parseFloat(document.getElementById('hollow').value);
      const longGap = parseFloat(document.getElementById('longGap').value);
      const shortGap = parseFloat(document.getElementById('shortGap').value);

      if (isNaN(height) || isNaN(hollow) || height <= 0 || hollow <= 0) {
        document.getElementById('strips').value = "";
        document.getElementById('gapResult').innerText = "";
        return;
      }

      let targetGap = !isNaN(longGap) && longGap > 0 ? longGap : (!isNaN(shortGap) && shortGap > 0 ? shortGap : 100);
      let calculatedStrips = Math.round((height - targetGap) / (hollow + targetGap));
      if (calculatedStrips < 1) calculatedStrips = 1;

      document.getElementById('strips').value = calculatedStrips;
      calculateGapOnly();
    }

    function adjustStrips(amount) {
      let stripsEl = document.getElementById('strips');
      let currentStrips = parseInt(stripsEl.value) || 0;
      currentStrips += amount;
      if (currentStrips < 0) currentStrips = 0;
      stripsEl.value = currentStrips > 0 ? currentStrips : "";
      calculateGapOnly();
    }

    function calculateGapOnly() {
      const height = parseFloat(document.getElementById('height').value);
      const hollow = parseFloat(document.getElementById('hollow').value);
      const strips = parseInt(document.getElementById('strips').value);

      if (isNaN(height) || isNaN(hollow) || isNaN(strips) || height <= 0 || hollow <= 0 || strips <= 0) {
        document.getElementById('gapResult').innerText = "";
        return;
      }

      let gap = (height - (strips * hollow)) / (strips + 1);
      document.getElementById('gapResult').innerText = gap > 0 ? gap.toFixed(2) : "";
    }
  </script>

</body>
</html>
