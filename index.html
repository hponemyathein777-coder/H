<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CY Stainless Steel Enterprise</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: #333;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .calculator-card {
      width: 100%;
      max-width: 440px;
      background: #4a4a4d;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #555;
    }

    .logo-box {
      width: 44px;
      height: 44px;
      background: #a33b45;
      margin: 0 auto 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 6px;
    }

    .logo-box div {
      width: 20px;
      height: 20px;
      border: 3px solid #fff;
      border-radius: 2px;
    }

    .title {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .label {
      width: 110px;
      font-size: 14px;
      color: #ffffff;
      font-weight: bold;
    }

    .colon {
      width: 20px;
      font-size: 14px;
      color: #ffffff;
      font-weight: bold;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="number"] {
      width: 100%;
      background: #7a7a7e;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 8px 10px;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      outline: none;
    }

    input[type="number"]::placeholder {
      color: #ccc;
      font-weight: normal;
      font-size: 13px;
    }

    .btn-counter {
      width: 32px;
      height: 32px;
      background: #555;
      border: 1px solid #222;
      border-radius: 4px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .btn-counter:active {
      background: #333;
    }

    .result-box {
      width: 100%;
      background: #7a7a7e;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 15px;
      font-weight: bold;
      color: #00ffcc;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <div class="logo-box">
      <div></div>
    </div>
    <div class="title">CY Stainless Steel Enterprise</div>

    <div class="input-row">
      <div class="label">Height</div>
      <div class="colon">:</div>
      <div class="input-wrapper">
        <input type="number" id="height" placeholder="Height of inner object (mm)" oninput="autoCalculate()">
      </div>
    </div>

    <div class="input-row">
      <div class="label">Hollow</div>
      <div class="colon">:</div>
      <div class="input-wrapper">
        <input type="number" id="hollow" placeholder="Width of hollow steel (mm)" oninput="autoCalculate()">
      </div>
    </div>

    <div class="input-row">
      <div class="label">Long Gap</div>
      <div class="colon">:</div>
      <div class="input-wrapper">
        <input type="number" id="longGap" placeholder="Maximum distance of gap (mm)" oninput="autoCalculate()">
      </div>
    </div>

    <div class="input-row">
      <div class="label">Short Gap</div>
      <div class="colon">:</div>
      <div class="input-wrapper">
        <input type="number" id="shortGap" placeholder="Minimum distance of gap (mm)" oninput="autoCalculate()">
      </div>
    </div>

    <div class="input-row" style="margin-top: 18px;">
      <div class="label">Strips</div>
      <div class="colon">:</div>
      <div class="input-wrapper">
        <input type="number" id="strips" value="0" oninput="calculateGapFromStrips()">
        <div class="btn-counter" onclick="adjustStrips(1)">+</div>
        <div class="btn-counter" onclick="adjustStrips(-1)">-</div>
      </div>
    </div>

    <div class="input-row">
      <div class="label">Gap</div>
      <div class="colon">:</div>
      <div class="input-wrapper">
        <div class="result-box" id="gapResult">0.00</div>
      </div>
    </div>
  </div>

  <script>
    function autoCalculate() {
      const height = parseFloat(document.getElementById('height').value) || 0;
      const hollow = parseFloat(document.getElementById('hollow').value) || 0;
      const longGap = parseFloat(document.getElementById('longGap').value) || 0;

      if (height <= 0 || hollow <= 0 || longGap <= 0) {
        document.getElementById('strips').value = 0;
        document.getElementById('gapResult').innerText = "0.00";
        return;
      }

      // Calculate initial strips based on long gap limit
      let calculatedStrips = Math.ceil((height - longGap) / (hollow + longGap));
      if (calculatedStrips < 1) calculatedStrips = 1;

      document.getElementById('strips').value = calculatedStrips;
      calculateGapFromStrips();
    }

    function adjustStrips(amount) {
      let stripsEl = document.getElementById('strips');
      let currentStrips = parseInt(stripsEl.value) || 0;
      currentStrips += amount;
      if (currentStrips < 0) currentStrips = 0;
      stripsEl.value = currentStrips;
      calculateGapFromStrips();
    }

    function calculateGapFromStrips() {
      const height = parseFloat(document.getElementById('height').value) || 0;
      const hollow = parseFloat(document.getElementById('hollow').value) || 0;
      const strips = parseInt(document.getElementById('strips').value) || 0;

      if (height <= 0 || hollow <= 0 || strips <= 0) {
        document.getElementById('gapResult').innerText = "0.00";
        return;
      }

      let gap = (height - (strips * hollow)) / (strips + 1);
      document.getElementById('gapResult').innerText = gap > 0 ? gap.toFixed(2) : "0.00";
    }
  </script>

</body>
</html>
