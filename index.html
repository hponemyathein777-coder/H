<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khan Job Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1c1c1e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-card {
            width: 100%;
            max-width: 420px;
            background-color: #2c2c2e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #3a3a3c;
        }

        .title {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #e5e5ea;
            margin-bottom: 24px;
        }

        .input-row {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
        }

        .label {
            width: 110px;
            font-size: 14px;
            color: #d1d1d6;
            font-weight: 500;
        }

        .colon {
            width: 20px;
            font-size: 14px;
            color: #d1d1d6;
            font-weight: bold;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="number"] {
            width: 100%;
            background-color: #1c1c1e;
            border: 1px solid #3a3a3c;
            border-radius: 8px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #6366f1;
        }

        .btn-counter {
            width: 36px;
            height: 36px;
            background-color: #3a3a3c;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .btn-counter:active {
            background-color: #48484a;
        }

        .result-box {
            background-color: #1c1c1e;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 15px;
            color: #4ade80;
            font-weight: 600;
            width: 100%;
            border: 1px solid #3a3a3c;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="title">Khan Job Calculator</div>

    <div class="input-row">
        <div class="label">Height</div>
        <div class="colon">:</div>
        <div class="input-wrapper">
            <input type="number" id="height" placeholder="Height (mm)" oninput="calculateBase()">
        </div>
    </div>

    <div class="input-row">
        <div class="label">Hollow</div>
        <div class="colon">:</div>
        <div class="input-wrapper">
            <input type="number" id="hollow" placeholder="Hollow size (mm)" oninput="calculateBase()">
        </div>
    </div>

    <div class="input-row">
        <div class="label">Long Gap</div>
        <div class="colon">:</div>
        <div class="input-wrapper">
            <input type="number" id="longGap" placeholder="Max gap (mm)" oninput="calculateBase()">
        </div>
    </div>

    <div class="input-row">
        <div class="label">Short Gap</div>
        <div class="colon">:</div>
        <div class="input-wrapper">
            <input type="number" id="shortGap" placeholder="Min gap (mm)" oninput="calculateBase()">
        </div>
    </div>

    <div class="input-row">
        <div class="label">Strips</div>
        <div class="colon">:</div>
        <div class="input-wrapper">
            <input type="number" id="strips" value="0" readonly>
            <button class="btn-counter" onclick="changeStrips(1)">+</button>
            <button class="btn-counter" onclick="changeStrips(-1)">-</button>
        </div>
    </div>

    <div class="input-row">
        <div class="label">Gap</div>
        <div class="colon">:</div>
        <div class="input-wrapper">
            <div class="result-box" id="gapResult">0.00</div>
        </div>
    </div>
</div>

<script>
    function calculateBase() {
        const height = parseFloat(document.getElementById('height').value) || 0;
        const hollow = parseFloat(document.getElementById('hollow').value) || 0;
        const longGap = parseFloat(document.getElementById('longGap').value) || 0;

        if (height > 0 && hollow > 0 && longGap > 0) {
            let strips = Math.ceil((height - longGap) / (hollow + longGap));
            document.getElementById('strips').value = strips;
            updateGap();
        } else {
            document.getElementById('strips').value = 0;
            document.getElementById('gapResult').innerText = '0.00';
        }
    }

    function changeStrips(val) {
        let stripsInput = document.getElementById('strips');
        let currentStrips = parseInt(stripsInput.value) || 0;
        let newStrips = currentStrips + val;
        
        if (newStrips >= 0) {
            stripsInput.value = newStrips;
            updateGap();
        }
    }

    function updateGap() {
        const height = parseFloat(document.getElementById('height').value) || 0;
        const hollow = parseFloat(document.getElementById('hollow').value) || 0;
        const strips = parseInt(document.getElementById('strips').value) || 0;

        if (height > 0 && strips > 0) {
            let gap = (height - (strips * hollow)) / (strips + 1);
            document.getElementById('gapResult').innerText = gap > 0 ? gap.toFixed(2) : '0.00';
        } else {
            document.getElementById('gapResult').innerText = '0.00';
        }
    }
</script>

</body>
</html>
